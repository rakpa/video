<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Free online video downloader. Save YouTube, Facebook and Instagram videos in HD, 2K and 4K — always with sound, no watermark, no sign-up."
    />
    <title>ClipVault — Free Video Downloader for YouTube, Facebook &amp; Instagram</title>

    <!-- Canonical (replace with your production domain before launch) -->
    <link rel="canonical" href="https://clipvault.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClipVault" />
    <meta property="og:title" content="ClipVault — Free Video Downloader for YouTube, Facebook & Instagram" />
    <meta
      property="og:description"
      content="Download YouTube, Facebook and Instagram videos in HD, 2K and 4K — always with sound, no watermark, no sign-up."
    />
    <meta property="og:url" content="https://clipvault.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ClipVault — Free Video Downloader for YouTube, Facebook & Instagram" />
    <meta
      name="twitter:description"
      content="Download YouTube, Facebook and Instagram videos in HD, 2K and 4K — always with sound, no watermark, no sign-up."
    />

    <!-- Google AdSense: replace ca-pub-XXXX then uncomment -->
    <!-- <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->

    <!-- Structured data: software application -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "ClipVault",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Web",
        "url": "https://clipvault.app/",
        "description": "Free online video downloader for YouTube, Facebook and Instagram. Save videos in HD, 2K and 4K with sound — no watermark, no sign-up.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Inter — primary UI typeface (loaded from Google Fonts). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
