name: doc_scanner
description: "Paperly — cross-platform offline document scanner (Flutter)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0

  permission_handler: ^11.3.1
  camera: ^0.11.1
  image_picker: ^1.1.2

  image: ^4.3.0

  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  package_info_plus: ^8.1.2
  archive: ^3.6.1
  gal: ^2.3.0

  google_mlkit_text_recognition: ^0.14.0

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  shared_preferences: ^2.3.2

  uuid: ^4.5.1
  intl: ^0.19.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/icon/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/stitch/
    - assets/stitch/html/
    - assets/images/
