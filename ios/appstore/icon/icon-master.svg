<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- Brand accent: linear-gradient(120deg, #4f46e5, #7c3aed) -->
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0.75">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Soft top-light sheen to give the flat gradient depth -->
    <radialGradient id="sheen" cx="0.3" cy="0.18" r="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="tri-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Full-bleed square: NO rounded corners / alpha (Apple applies the mask). -->
  <rect width="1024" height="1024" fill="url(#brand)"/>
  <rect width="1024" height="1024" fill="url(#sheen)"/>

  <!-- White play triangle — same geometry as the in-app BrandLogo (M8 5v14l11-7L8 5Z). -->
  <g transform="translate(107,152) scale(30)" filter="url(#tri-shadow)">
    <path d="M8 5v14l11-7L8 5Z" fill="#ffffff" stroke="#ffffff"
          stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
