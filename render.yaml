# Deploy on Render: https://render.com → New + → Blueprint → connect github.com/rakpa/video
# After deploy, set Vercel env VITE_API_URL to the Render service URL shown below.
services:
  - type: web
    name: clipvault-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: 'false'
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://video-beige-five.vercel.app
      - key: YTDLP_PATH
        value: yt-dlp
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: TMP_TTL_MINUTES
        value: 30
      - key: MAX_DURATION_MINUTES
        value: 180
      - key: LICENSE_SECRET
        generateValue: true
      # YouTube blocks datacenter IPs ("Sign in to confirm you're not a bot").
      # To authenticate yt-dlp, add a Netscape cookies.txt as a Render
      # "Secret File" (Service → Settings → Secret Files), then uncomment:
      # - key: YTDLP_COOKIES
      #   value: /etc/secrets/cookies.txt
      # YouTube PO Token (yt-dlp wiki: PO Token Guide). Use with mweb client.
      # - key: YTDLP_PO_TOKEN
      #   sync: false
      # - key: YTDLP_PLAYER_CLIENT
      #   value: mweb
      # Route yt-dlp through a (residential) proxy to beat datacenter-IP blocks,
      # like Cobalt's API_EXTERNAL_PROXY. Format: http://user:pass@host:port
      # - key: YTDLP_PROXY
      #   value: http://user:pass@proxy.example.com:8080
      # The BgUtils PO-token provider runs inside the container (port 4416) and is
      # used automatically; set YTDLP_POT_BASE_URL only to point at an external one.
