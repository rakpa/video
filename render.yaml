# Deploy on Render: https://render.com → New + → Blueprint → connect github.com/rakpa/video
# After deploy, set Vercel env VITE_API_URL to the Render service URL shown below.
services:
  - type: web
    name: clipvault-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_CLIENT
        value: 'false'
      - key: PORT
        value: 10000
      - key: CLIENT_ORIGIN
        value: https://vidcliply.com,https://video77-xi.vercel.app,https://video1-two.vercel.app,https://clipvault-web.onrender.com
      - key: YTDLP_PATH
        value: yt-dlp
      - key: FFMPEG_PATH
        value: ffmpeg
      - key: LOW_MEMORY_MODE
        value: 'true'
      - key: MAX_CONCURRENT_JOBS
        value: '1'
      - key: NODE_OPTIONS
        value: '--max-old-space-size=192'
      - key: TMP_TTL_MINUTES
        value: 30
      - key: MAX_DURATION_MINUTES
        value: 180
      - key: FREE_MAX_HEIGHT
        value: '1080'
      # Free 2K/4K downloads allowed per IP before Pro is required.
      - key: FREE_HIGH_RES_LIMIT
        value: '5'
      # Durable per-IP 2K/4K counter (Upstash Redis). Without these the count
      # falls back to the ephemeral SQLite DB and resets on every restart.
      # Create a free DB at https://console.upstash.com → copy REST URL + token.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: ADMIN_EMAILS
        value: rakpa8@gmail.com
      - key: LICENSE_SECRET
        generateValue: true
      # YouTube blocks datacenter IPs ("Sign in to confirm you're not a bot").
      # To authenticate yt-dlp, add a Netscape cookies.txt as a Render
      # "Secret File" (Service → Settings → Secret Files), then uncomment:
      # - key: YTDLP_COOKIES
      #   value: /etc/secrets/cookies.txt
      # YouTube PO Token (yt-dlp wiki: PO Token Guide). Use with mweb client.
      # - key: YTDLP_PO_TOKEN
      #   sync: false
      # - key: YTDLP_PLAYER_CLIENT
      #   value: mweb
      # Route yt-dlp through a (residential) proxy to beat datacenter-IP blocks,
      # like Cobalt's API_EXTERNAL_PROXY. Format: http://user:pass@host:port
      # - key: YTDLP_PROXY
      #   value: http://user:pass@proxy.example.com:8080
      # The BgUtils PO-token provider runs inside the container (port 4416) and is
      # used automatically; set YTDLP_POT_BASE_URL only to point at an external one.

  # Static frontend mirror — deploys when Vercel free-tier daily limit (100) is hit.
  - type: web
    name: clipvault-web
    runtime: static
    plan: free
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://clipvault-api-wbnx.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
