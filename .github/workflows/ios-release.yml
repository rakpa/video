name: iOS Release

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (CFBundleVersion). Bump for every upload.'
        type: string
        default: '1'

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.paperly.scanner
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUILD_NUMBER: ${{ inputs.build_number }}

    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Fail fast if signing secrets are missing
        env:
          P8_PRESENT: ${{ secrets.ASC_KEY_P8 != '' }}
          CERT_PRESENT: ${{ secrets.IOS_DIST_CERT_P12 != '' }}
          PROFILE_PRESENT: ${{ secrets.IOS_PROVISIONING_PROFILE != '' }}
        run: |
          test -n "$APPLE_TEAM_ID"       || { echo "::error::APPLE_TEAM_ID missing"; exit 1; }
          test -n "$ASC_KEY_ID"          || { echo "::error::ASC_KEY_ID missing"; exit 1; }
          test -n "$ASC_ISSUER_ID"       || { echo "::error::ASC_ISSUER_ID missing"; exit 1; }
          test "$P8_PRESENT" = "true"    || { echo "::error::ASC_KEY_P8 missing"; exit 1; }
          test "$CERT_PRESENT" = "true"  || { echo "::error::IOS_DIST_CERT_P12 missing"; exit 1; }
          test -n "${{ secrets.IOS_CERT_PASSWORD }}" || { echo "::error::IOS_CERT_PASSWORD missing"; exit 1; }
          test "$PROFILE_PRESENT" = "true" || { echo "::error::IOS_PROVISIONING_PROFILE missing"; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies + codegen
        run: |
          flutter --version
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" | base64 --decode > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "API_KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Install signing certificate and provisioning profile
        env:
          IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          printf '%s' "${{ secrets.IOS_DIST_CERT_P12 }}" | base64 --decode > "$CERT_PATH"
          printf '%s' "${{ secrets.IOS_PROVISIONING_PROFILE }}" | base64 --decode > "$PROFILE_PATH"
          security create-keychain -p "$IOS_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_CERT_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /dev/stdin <<< "$(security cms -D -i "$PROFILE_PATH")")
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Prepare Flutter for Xcode
        run: |
          flutter precache --ios
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          echo "export FLUTTER_ROOT=\"$FLUTTER_ROOT\"" > ios/.xcode.env.local
          echo 'export PATH="$FLUTTER_ROOT/bin:$PATH"' >> ios/.xcode.env.local

      - name: Write export options
        run: |
          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        run: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ios/ExportOptions.plist

      - name: Upload .ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
