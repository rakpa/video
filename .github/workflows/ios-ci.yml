name: iOS CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-simulator:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      BUNDLE_ID: com.paperly.scanner
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencies + codegen
        run: |
          flutter --version
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Build unsigned iOS simulator app
        run: flutter build ios --debug --simulator
